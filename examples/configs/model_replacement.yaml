# Model-replacement stress test: compare an ordinary data-poisoning backdoor with the
# same backdoor boosted so it survives FedAvg. The replacement is single-shot in round 3.
# Reference and Flower should show the same direction of effect.
#
#   fltest run examples/configs/model_replacement.yaml
name: model_replacement_demo
device: cpu
dataset: mnist
model_name: MLP
num_clients: 4
num_rounds: 3
client_lr: 0.05
dataset_partitions: 20
max_test_data_size: 1024
metrics: [accuracy, loss, per_client]

runs:
  - framework: reference
    name: backdoor-reference
    attacks:
      - {name: backdoor, params: {target_label: 0, infection_rate: 0.8, patch_size: 5}, target_clients: [0]}

  - framework: reference
    name: replacement-reference
    attacks:
      - {name: backdoor, params: {target_label: 0, infection_rate: 0.8, patch_size: 5}, target_clients: [0]}
      - {name: model_replacement, params: {target_round: 3}, target_clients: [0]}

  - framework: flwr
    name: backdoor-flower
    attacks:
      - {name: backdoor, params: {target_label: 0, infection_rate: 0.8, patch_size: 5}, target_clients: [0]}

  - framework: flwr
    name: replacement-flower
    attacks:
      - {name: backdoor, params: {target_label: 0, infection_rate: 0.8, patch_size: 5}, target_clients: [0]}
      - {name: model_replacement, params: {target_round: 3}, target_clients: [0]}
